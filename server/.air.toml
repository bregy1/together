# air (air-verse/air v1.67.4): rebuilds and restarts the server on save.
# Development only (ADR-0012); air is GPL-3.0 and never part of a production image.
# Run from server/: `air` (configuration is read from this file).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 200 # ms
stop_on_error = true
send_interrupt = true # ignored on Windows, where air stops the process with TASKKILL
kill_delay = 1000 # values below 1 ms are read as milliseconds by air

# Windows needs an .exe file name and a backslash path.
[build.windows]
cmd = "go build -o ./tmp/server.exe ./cmd/server"
entrypoint = ["tmp\\server.exe"]

[log]
time = true

[misc]
clean_on_exit = true
